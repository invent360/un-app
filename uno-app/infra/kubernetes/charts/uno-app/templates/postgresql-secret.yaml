{{- if and .Values.database.internal.enabled .Values.db.auth.existingSecret }}
# PostgreSQL credentials secret (placeholder)
# For production, populate this secret externally before deployment:
#
#   kubectl create secret generic postgresql-credentials \
#     --from-literal=postgres-password=<ADMIN_PASSWORD> \
#     --from-literal=password=<USER_PASSWORD> \
#     --from-literal=replication-password=<REPLICATION_PASSWORD> \
#     -n {{ .Values.global.namespace }}
#
# Or patch after deployment:
#   kubectl patch secret postgresql-credentials -n {{ .Values.global.namespace }} \
#     -p '{"data":{"postgres-password":"BASE64_ENCODED_PASSWORD"}}'
#
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.auth.existingSecret }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Placeholder values - MUST be replaced before production use
  # These are base64 encoded empty strings
  {{ .Values.db.auth.secretKeys.adminPasswordKey }}: ""
  {{ .Values.db.auth.secretKeys.userPasswordKey }}: ""
  {{- if eq .Values.db.architecture "replication" }}
  {{ .Values.db.auth.secretKeys.replicationPasswordKey }}: ""
  {{- end }}
{{- end }}
