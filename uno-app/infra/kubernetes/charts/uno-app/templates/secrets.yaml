# Placeholder secrets - populate these before deployment
# Use bootstrap.sh or external secrets management
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded PostgreSQL connection URL
  url: ""
  {{- if eq .Values.databaseRole "replica" }}
  # Base64 encoded read replica URL (for replica regions only)
  read_replica_url: ""
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded admin API credentials
  api_key: ""
  client_id: ""
  secret_key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: r2-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded Cloudflare R2 credentials
  access_key_id: ""
  secret_access_key: ""
  endpoint: ""
  bucket_name: ""
