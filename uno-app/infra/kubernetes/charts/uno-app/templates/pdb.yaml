{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "uno-app.fullname" . }}-pdb
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "uno-app.selectorLabels" . | nindent 6 }}
{{- end }}
