apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uno-app.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
data:
  LEPTOS_ENV: {{ .Values.app.env.leptosEnv | quote }}
  RUST_LOG: {{ .Values.app.env.rustLog | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uno-app.fullname" . }}-region-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "uno-app.labels" . | nindent 4 }}
data:
  REGION: {{ .Values.region | quote }}
  PROVIDER: {{ .Values.provider | quote }}
  DATABASE_ROLE: {{ .Values.databaseRole | quote }}
