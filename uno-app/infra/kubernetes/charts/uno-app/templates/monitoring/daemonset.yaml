{{- if .Values.monitoring.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-agent
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "monitoring.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "monitoring.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: grafana-agent
      tolerations:
        - operator: Exists
      containers:
        - name: grafana-agent
          image: "{{ .Values.monitoring.grafanaAgent.image.repository }}:{{ .Values.monitoring.grafanaAgent.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.grafanaAgent.image.pullPolicy }}
          args:
            - -config.file=/etc/agent/agent.yaml
            - -config.expand-env=true
            - -enable-features=integrations-next
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-info
                  key: CLUSTER_NAME
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: cluster-info
                  key: REGION
            - name: PROMETHEUS_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: prometheus_url
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: loki_url
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: user
            - name: GRAFANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: api_key
          resources:
            requests:
              cpu: {{ .Values.monitoring.grafanaAgent.resources.requests.cpu }}
              memory: {{ .Values.monitoring.grafanaAgent.resources.requests.memory }}
            limits:
              cpu: {{ .Values.monitoring.grafanaAgent.resources.limits.cpu }}
              memory: {{ .Values.monitoring.grafanaAgent.resources.limits.memory }}
          volumeMounts:
            - name: config
              mountPath: /etc/agent
              readOnly: true
            - name: rootfs
              mountPath: /host/root
              readOnly: true
            - name: sysfs
              mountPath: /host/sys
              readOnly: true
            - name: procfs
              mountPath: /host/proc
              readOnly: true
            - name: tmpdir
              mountPath: /tmp
          securityContext:
            privileged: true
            runAsUser: 0
      volumes:
        - name: config
          configMap:
            name: grafana-agent-config
        - name: rootfs
          hostPath:
            path: /
        - name: sysfs
          hostPath:
            path: /sys
        - name: procfs
          hostPath:
            path: /proc
        - name: tmpdir
          emptyDir: {}
{{- end }}
