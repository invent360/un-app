{{- if .Values.monitoring.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-agent-config
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  agent.yaml: |
    server:
      log_level: info

    metrics:
      global:
        scrape_interval: {{ .Values.monitoring.scrape.interval }}
        scrape_timeout: {{ .Values.monitoring.scrape.timeout }}
        external_labels:
          cluster: ${CLUSTER_NAME}
          region: {{ .Values.region }}
      configs:
        - name: default
          remote_write:
            - url: ${PROMETHEUS_URL}
              basic_auth:
                username: ${GRAFANA_USER}
                password: ${GRAFANA_API_KEY}
          scrape_configs:
            # Scrape uno-app pods
            - job_name: 'uno-app'
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - {{ .Values.global.namespace }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: replace
                  target_label: app

            # Scrape kubernetes nodes
            - job_name: 'kubernetes-nodes'
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

            # Scrape kube-state-metrics
            - job_name: 'kube-state-metrics'
              kubernetes_sd_configs:
                - role: service
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
                  action: keep
                  regex: kube-state-metrics

    logs:
      configs:
        - name: default
          clients:
            - url: ${LOKI_URL}
              basic_auth:
                username: ${GRAFANA_USER}
                password: ${GRAFANA_API_KEY}
              external_labels:
                cluster: ${CLUSTER_NAME}
                region: {{ .Values.region }}
          positions:
            filename: /tmp/positions.yaml
          scrape_configs:
            # Scrape uno-app logs
            - job_name: 'uno-app-logs'
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - {{ .Values.global.namespace }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: uno-app
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
              pipeline_stages:
                - json:
                    expressions:
                      level: level
                      message: message
                      timestamp: timestamp
                - labels:
                    level:
                - timestamp:
                    source: timestamp
                    format: RFC3339

            # Scrape cloudflared logs
            - job_name: 'cloudflared-logs'
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - {{ .Values.cloudflared.namespace }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: cloudflared
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod

    integrations:
      node_exporter:
        enabled: true
        rootfs_path: /host/root
        sysfs_path: /host/sys
        procfs_path: /host/proc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  CLUSTER_NAME: "uno-app-{{ .Values.region }}"
  REGION: {{ .Values.region | quote }}
{{- end }}
