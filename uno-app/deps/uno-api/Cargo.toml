[package]
name = "uno-api"
version = "0.1.0"
edition = "2021"
description = "Modular license management API for UNO platform"
license = "MIT"

[dependencies]
# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["rt"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# CSV parsing
csv = { version = "1.3", optional = true }

# Error handling
thiserror = "2"

# HMAC authentication
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Random (for license key and nonce generation)
rand = "0.9"

# HTTP client (for admin apps)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Validation
validator = { version = "0.18", features = ["derive"], optional = true }

# Logging
tracing = "0.1"

[features]
default = ["services"]
services = ["dep:csv", "dep:validator"]
auth = ["dep:hmac", "dep:sha2", "dep:hex", "dep:base64"]
client = ["auth", "dep:reqwest", "dep:tokio"]
full = ["services", "auth", "client"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
