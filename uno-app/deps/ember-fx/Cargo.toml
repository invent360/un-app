[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/utils",
    "crates/macros",
    "crates/core",
    "crates/styles",
    "crates/icons",
    "crates/systems",
    "crates/components",
    "crates/tools",
    "crates/mobile", "crates/layouts",
    # "demos/antd-01",
    # "demos/showcase",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/polkanight/ember-fx"

[workspace.dependencies]
# Internal crates
ember-fx-common = { path = "crates/common" }
ember-fx-utils = { path = "crates/utils" }
ember-fx-macros = { path = "crates/macros" }
ember-fx-core = { path = "crates/core" }
ember-fx-styles = { path = "crates/styles" }
ember-fx-icons = { path = "crates/icons" }
ember-fx-systems = { path = "crates/systems" }
ember-fx-components = { path = "crates/components" }
ember-fx-tools = { path = "crates/tools" }
ember-fx-mobile = { path = "crates/mobile" }
ember-fx-layouts = { path = "crates/layouts" }

# External dependencies
leptos = "0.8"
leptos_router = "0.8"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlStyleElement",
    "HtmlInputElement",
    "Window",
    "Navigator",
    "Node",
    "NodeList",
    "CssStyleSheet",
    "StyleSheetList",
    "File",
    "FileList",
    "DataTransfer",
    "DragEvent",
    "DomRect",
    "MouseEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-storage = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# Build dependencies
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
walkdir = "2.5"

# Macro dependencies
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
