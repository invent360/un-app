name: Deployment contract validation

on:
  push:
    paths:
      - deployment/**
      - .github/workflows/infrastructure.yml
      - scripts/validate_deployment_contract.py
  pull_request:
    paths:
      - deployment/**
      - .github/workflows/infrastructure.yml
      - scripts/validate_deployment_contract.py
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_deployment_contract.py
