name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Check changed Rust source formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_changed_rustfmt.py

  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: python3 scripts/check_dependency_provenance.py
      - run: python3 scripts/validate_deployment_contract.py

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [uno-app, uno-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: SSR binary and library
        run: cargo check --locked -p ${{ matrix.package }} --features ssr --lib --bin ${{ matrix.package }}
      - name: Hydration library
        run: cargo check --locked -p ${{ matrix.package }} --lib --features hydrate --target wasm32-unknown-unknown

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [uno-app, uno-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Deny correctness and suspicious lints in each app
        run: cargo clippy --locked --no-deps -p ${{ matrix.package }} --features ssr --lib --bin ${{ matrix.package }} -- -A warnings -D clippy::correctness -D clippy::suspicious

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uno_test
          POSTGRES_PASSWORD: uno_ci_test_only
          POSTGRES_DB: uno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uno_test -d uno_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://uno_test:uno_ci_test_only@localhost:5432/uno_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - name: Apply all migrations on fresh PostgreSQL
        run: cargo sqlx migrate run --source uno-app/migrations
      - name: Shared authentication and API tests
        run: cargo test --locked -p uno-api --features web-auth,services,client
      - name: Local filesystem boundary tests
        run: cargo test --locked -p file-storage --no-default-features --features local
      - name: Optional GCS signing regression tests
        run: cargo test --locked -p file-storage --no-default-features --features gcs --lib
      - name: Portal unit tests
        run: cargo test --locked -p uno-app --features ssr --lib
      - name: Registered portal routes against migrated PostgreSQL
        run: cargo test --locked -p uno-app --features ssr --test phase0_http
      # R5-15: Run phase4-9 integration tests that require database
      # These tests are marked #[ignore = "requires database connection"]
      # but CI has PostgreSQL available, so run them with --include-ignored
      - name: Phase 4 concurrent claims integration tests
        run: cargo test --locked -p uno-app --features ssr --test phase4_concurrent_claims -- --include-ignored
      - name: Phase 5 finance reconciliation tests
        run: cargo test --locked -p uno-app --features ssr --test phase5_finance_reconciliation -- --include-ignored
      - name: Phase 9 acceptance tests
        run: cargo test --locked -p uno-app --features ssr --test phase9_acceptance -- --include-ignored
      - name: Phase 9 concurrent claim tests
        run: cargo test --locked -p uno-app --features ssr --test phase9_concurrent -- --include-ignored
      - name: Admin unit tests
        run: cargo test --locked -p uno-admin --features ssr --lib

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [uno-app, uno-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.package }}/Dockerfile
          push: false
          load: true
          tags: local/${{ matrix.package }}:ci
          platforms: linux/amd64
      - name: Record image digest
        run: |
          docker inspect local/${{ matrix.package }}:ci --format='{{.Id}}' > ${{ matrix.package }}-digest.txt
          echo "Image digest for ${{ matrix.package }}:"
          cat ${{ matrix.package }}-digest.txt
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-image-digest
          path: ${{ matrix.package }}-digest.txt
          retention-days: 90

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 scripts/audit_release_dependencies.py

  worker-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # R5-15: Build the actual worker binary, not uno-app
      - name: Compile worker binary
        run: cargo build --locked -p uno-app --features ssr --bin worker
      - name: Record binary hash
        run: |
          sha256sum target/debug/worker > worker-hash.txt
          echo "Worker binary hash:"
          cat worker-hash.txt
      - name: Upload worker hash
        uses: actions/upload-artifact@v4
        with:
          name: worker-binary-hash
          path: worker-hash.txt
          retention-days: 90

  container-scan:
    runs-on: ubuntu-latest
    needs: containers
    strategy:
      fail-fast: false
      matrix:
        package: [uno-app, uno-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild container for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.package }}/Dockerfile
          push: false
          load: true
          tags: local/${{ matrix.package }}:scan
          platforms: linux/amd64
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.package }}:scan
          format: 'sarif'
          output: trivy-${{ matrix.package }}.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-${{ matrix.package }}
          path: trivy-${{ matrix.package }}.sarif
          retention-days: 90
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.package }}:scan
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  artifact-manifest:
    runs-on: ubuntu-latest
    needs: [compile, worker-compile, containers, tests, audit]
    steps:
      - uses: actions/checkout@v4
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release manifest
        run: python3 scripts/generate_release_manifest.py
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 365

  ci-success:
    runs-on: ubuntu-latest
    needs: [format, source-contracts, compile, clippy, tests, containers, audit, worker-compile, container-scan, artifact-manifest]
    if: always()
    steps:
      - name: Require every job to succeed
        run: |
          for result in \
            '${{ needs.format.result }}' \
            '${{ needs.source-contracts.result }}' \
            '${{ needs.compile.result }}' \
            '${{ needs.clippy.result }}' \
            '${{ needs.tests.result }}' \
            '${{ needs.containers.result }}' \
            '${{ needs.audit.result }}' \
            '${{ needs.worker-compile.result }}' \
            '${{ needs.container-scan.result }}' \
            '${{ needs.artifact-manifest.result }}'; do
            if [ "$result" != success ]; then
              echo "Required CI job ended as $result"
              exit 1
            fi
          done
