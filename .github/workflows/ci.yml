name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check formatting
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting (uno-app)
        run: cargo fmt --all -- --check
        working-directory: uno-app
      - name: Check formatting (uno-admin)
        run: cargo fmt --all -- --check
        working-directory: uno-admin
      - name: Check formatting (uno-api)
        run: cargo fmt --all -- --check
        working-directory: uno-api
      - name: Check formatting (file-storage)
        run: cargo fmt --all -- --check
        working-directory: file-storage

  # Run clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            uno-app
            uno-admin
            uno-api
            file-storage
      - name: Clippy (uno-app)
        run: cargo clippy --features ssr -- -D warnings
        working-directory: uno-app
      - name: Clippy (uno-admin)
        run: cargo clippy --features ssr -- -D warnings
        working-directory: uno-admin
        continue-on-error: true  # Has missing dependency
      - name: Clippy (uno-api)
        run: cargo clippy -- -D warnings
        working-directory: uno-api
      - name: Clippy (file-storage)
        run: cargo clippy -- -D warnings
        working-directory: file-storage

  # Run unit tests with coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uno_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            uno-app
            uno-api
            file-storage

      # Install cargo-tarpaulin for coverage
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      # Run database migrations
      - name: Run migrations
        run: |
          cargo install sqlx-cli --no-default-features --features rustls,postgres
          sqlx database create
          sqlx migrate run
        working-directory: uno-app
        continue-on-error: true

      # Run tests with coverage
      - name: Run tests with coverage
        run: |
          cargo tarpaulin --features ssr \
            --out Xml \
            --out Html \
            --output-dir coverage \
            --skip-clean \
            --ignore-tests \
            --timeout 300 \
            --exclude-files "tests/*" \
            --exclude-files "src/main.rs"
        working-directory: uno-app

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: uno-app/coverage/cobertura.xml
          fail_ci_if_error: false
          verbose: true

      # Upload coverage artifacts
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: uno-app/coverage/
          retention-days: 30

  # Check WASM build
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uno-app
      - name: Check WASM build (uno-app)
        run: cargo check --lib --features hydrate --target wasm32-unknown-unknown
        working-directory: uno-app

  # Build server binary
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uno-app
      - name: Build server
        run: cargo build --features ssr --release
        working-directory: uno-app
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: uno-app/target/release/uno-app
          retention-days: 7

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit uno-app
        run: cargo audit
        working-directory: uno-app
      - name: Audit uno-api
        run: cargo audit
        working-directory: uno-api
      - name: Audit file-storage
        run: cargo audit
        working-directory: file-storage

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uno-app
      - name: Build documentation
        run: cargo doc --features ssr --no-deps
        working-directory: uno-app
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: uno-app/target/doc/
          retention-days: 7

  # Verify database migrations
  migrations:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uno_test
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres
      - name: Create database
        run: sqlx database create
        working-directory: uno-app
      - name: Run migrations
        run: sqlx migrate run
        working-directory: uno-app
      - name: Verify migrations are complete
        run: |
          # Check that all migrations ran successfully
          psql $DATABASE_URL -c "SELECT * FROM _sqlx_migrations ORDER BY version;"

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, wasm-build, build-server, security-audit, migrations]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] ||
             [ "${{ needs.clippy.result }}" != "success" ] ||
             [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.wasm-build.result }}" != "success" ] ||
             [ "${{ needs.build-server.result }}" != "success" ] ||
             [ "${{ needs.security-audit.result }}" != "success" ] ||
             [ "${{ needs.migrations.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required checks passed!"
