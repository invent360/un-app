name: Release promotion (guarded)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact verified release commit
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Validate deployment contract
        run: python3 scripts/validate_deployment_contract.py
      - name: Require completed release gates and a verified Ember adapter
        run: python3 scripts/require_release_evidence.py
