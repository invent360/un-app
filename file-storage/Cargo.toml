[package]
name = "file-storage"
version = "0.1.0"
edition = "2021"
description = "Modular cloud file storage with pluggable backends (GCS, S3, Azure, local)"
license = "MIT"
authors = ["U-Network Team"]

[dependencies]
# Core
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Networking
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
rustix = { version = "1.1", features = ["fs"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }

# GCS authentication
jsonwebtoken = { version = "9.3", optional = true }
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
urlencoding = { version = "2.1", optional = true }

[features]
# Local backend is default for production (no cloud dependencies)
default = ["local"]
gcs = ["jsonwebtoken", "ring", "base64", "sha2", "hex", "urlencoding", "dep:reqwest"]
local = ["dep:rustix", "dep:image"]
full = ["gcs", "local"]

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
