[package]
name = "uno-admin"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
actix-files = { version = "0.6", optional = true }
actix-web = { version = "4", optional = true, features = ["macros"] }
console_error_panic_hook = "0.1"
http = { version = "1.3.1", optional = true }
leptos = { version = "0.8.2", features = ["nightly"] }
leptos_meta = { version = "0.8.2" }
leptos_actix = { version = "0.8.2", optional = true }
leptos_router = { version = "0.8.2", features = ["nightly"] }
wasm-bindgen = "0.2.121"
js-sys = "0.3.76"
gloo-storage = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "FileList", "File", "FileReader", "Blob", "BlobPropertyBag", "Url", "DomRect", "DataTransfer", "DragEvent", "FormData"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde", "wasmbind"] }

# Database dependencies (SSR only)
scylla = { version = "0.15", optional = true }
uuid = { version = "1.0", features = ["v4", "serde"], optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
inventory = "0.3"
dotenvy = { version = "0.15", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

# WebSocket support for real-time updates
actix-ws = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }

# File storage for cloud uploads (GCS, S3, etc.)
file-storage = { path = "../file-storage", features = ["gcs"], optional = true }
actix-multipart = { version = "0.7", optional = true }

# Base64 encoding/decoding for image conversion
base64 = { version = "0.22", optional = true }

# UNO API client for license management
uno-api = { path = "../uno-api", features = ["client"], optional = true }

# Multi-chain wallet library for Web3 authentication
ember-multichain = { path = "../../../../Dev-x/polkanight/ember/ember-multichain", features = ["evm"], optional = true }

# ember-fx UI Components (Table, Select, Button, etc.) with Prime styling
ember-fx-components = { path = "../../../../Dev-x/polkanight/ember/ember-fx/crates/components", features = ["data", "selection", "input", "button", "notification", "layout", "prime", "slider"], optional = true }

# Theme context and providers
ember-fx-core = { path = "../../../../Dev-x/polkanight/ember/ember-fx/crates/core", optional = true }

# Icons
ember-fx-icons = { path = "../../../../Dev-x/polkanight/ember/ember-fx/crates/icons", features = ["tabler-system", "tabler-arrows", "flags"], optional = true }

[features]
# Minimal feature for standalone database scripts (no UI dependencies)
seeder = ["dep:scylla", "dep:tokio", "dep:dotenvy", "dep:uuid"]
csr = ["leptos/csr", "dep:ember-fx-components", "dep:ember-fx-core", "dep:ember-fx-icons", "ember-fx-components/csr", "ember-fx-core/csr"]
hydrate = ["leptos/hydrate", "dep:ember-fx-components", "dep:ember-fx-core", "dep:ember-fx-icons", "dep:futures-util", "ember-fx-components/hydrate", "ember-fx-core/hydrate"]
ssr = [
  "dep:actix-files",
  "dep:actix-web",
  "dep:actix-ws",
  "dep:actix-multipart",
  "dep:futures-util",
  "dep:leptos_actix",
  "dep:scylla",
  "dep:tokio",
  "dep:dotenvy",
  "dep:uuid",
  "dep:async-trait",
  "dep:sha2",
  "dep:hmac",
  "dep:hex",
  "dep:reqwest",
  "dep:uno-api",
  "dep:tracing-subscriber",
  "dep:ember-fx-components",
  "dep:ember-fx-core",
  "dep:ember-fx-icons",
  "dep:ember-multichain",
  "dep:file-storage",
  "dep:base64",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "ember-fx-components/ssr",
  "ember-fx-core/ssr",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "upload-content"
path = "scripts/upload_content.rs"
required-features = ["ssr"]

[[bin]]
name = "restore-content"
path = "scripts/restore_content.rs"
required-features = ["ssr"]

[[bin]]
name = "seed-rewards"
path = "scripts/seed_rewards.rs"
required-features = ["seeder"]

[package.metadata.leptos]
# The binary target to use for the server
bin-target = "uno-admin"
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "uno-admin"
# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"
# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"
# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
style-file = "style/main.scss"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "assets"
# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3002"
# The port to use for automatic reload monitoring
reload-port = 3003
# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"
# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"
# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
